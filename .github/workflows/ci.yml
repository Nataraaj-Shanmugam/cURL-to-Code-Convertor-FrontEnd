name: CI

on:
  push:
  pull_request:

# Branches with an open PR trigger both events; cancel superseded PR runs only,
# so every push to a long-lived branch still gets its own complete run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Type-check, lint, docs check, unit tests with coverage, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Repo hygiene and docs drift
        run: npm run check:docs

      - name: Unit tests with coverage gate (Vitest, 90%)
        run: npm run test:coverage

      - name: Build
        # The build refuses a missing or loopback VITE_CURL_CRAFT_API_URL
        # (scripts/envGuard.ts), so give it a dummy public one. Never deployed.
        env:
          VITE_CURL_CRAFT_API_URL: https://api.example.test
        run: npm run build

  e2e:
    name: Playwright e2e (mocked API)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # playwright.config.ts starts `npm run dev` itself; every backend call is
      # mocked in e2e/fixtures.ts, so no backend or env vars are needed.
      - name: Run e2e tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  perf-bundle:
    name: Bundle-size budgets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Sizes only: deterministic, needs no browser. Timing budgets are run by hand on an idle
      # machine (see docs/testing/performance-report.md), because shared runners are too noisy.
      - name: Bundle budgets
        run: npm run perf:check -- --bundle-only

  live-e2e:
    name: Live e2e (real backend, optional)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Optional: needs the private backend repository, so it must not block a merge. Set the
    # BACKEND_REPO_TOKEN secret (read access to the backend repo) to make it run; without it the
    # checkout step fails and this job reports a failure that does not fail the workflow.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Check out the backend (PreProd)
        uses: actions/checkout@v7
        with:
          repository: Nataraaj-Shanmugam/cURL-to-Code-Convertor-BackEnd
          ref: PreProd
          token: ${{ secrets.BACKEND_REPO_TOKEN }}
          path: backend

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # run_backend.py starts the backend with the Python 3.11 interpreter from setup-python.
      - name: Run live e2e
        env:
          CURLCRAFT_BACKEND_DIR: ${{ github.workspace }}/backend
          CURLCRAFT_BACKEND_PYTHON: ${{ env.pythonLocation }}/bin/python
        run: npm run test:e2e:live

      - name: Upload live Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-live
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
