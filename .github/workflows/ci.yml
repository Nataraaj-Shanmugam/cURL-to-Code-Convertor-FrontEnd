name: CI

on:
  push:
  pull_request:

# Branches with an open PR trigger both events; cancel superseded PR runs only,
# so every push to a long-lived branch still gets its own complete run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Type-check, lint, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npm test

      - name: Build
        # The build refuses a missing or loopback VITE_CURL_CRAFT_API_URL
        # (scripts/envGuard.ts), so give it a dummy public one. Never deployed.
        env:
          VITE_CURL_CRAFT_API_URL: https://api.example.test
        run: npm run build

  e2e:
    name: Playwright e2e (mocked API)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # playwright.config.ts starts `npm run dev` itself; every backend call is
      # mocked in e2e/fixtures.ts, so no backend or env vars are needed.
      - name: Run e2e tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
